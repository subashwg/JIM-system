version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - jim_pg_data:/var/lib/postgresql/data

volumes:
  jim_pg_data:
